# game.joltcomputing.com -- Phaser static frontend + Node API/WS reverse proxy.
# certbot --nginx will add the listen 443 block, cert paths, and the 80->443 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name game.joltcomputing.com;

    root /var/www/codequest/frontend;
    index index.html;

    # Static Phaser frontend (SPA-style fallback).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache"; # always revalidate so JS updates aren't cached
    }

    # Node API.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket multiplayer (needs Upgrade/Connection headers).
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
