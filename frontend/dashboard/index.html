<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeQuest — Teacher Dashboard</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { overflow: auto; }
    #dash { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .dash-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
    .dash-head h1 { color: var(--gold); margin: 0; }
    .dash-head .sub { color: var(--muted); }
    .stat-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px 18px; }
    .stat .n { font-size: 28px; color: var(--gold); font-weight: bold; }
    .stat .l { color: var(--muted); font-size: 13px; }
    .dash-cols { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
    .card h2 { color: var(--gold); margin: 0 0 12px; font-size: 16px; }
    table.grid { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.grid th, table.grid td { text-align: left; padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    table.grid th { color: var(--muted); font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    table.grid td.num, table.grid th.num { text-align: right; }
    tr.pupil { cursor: pointer; }
    tr.pupil:hover { background: var(--panel-light); }
    tr.pupil.sel { background: var(--panel-light); outline: 1px solid var(--gold); }
    tr.pupil.stuck td:first-child::before { content: "⚠ "; color: var(--bad); }
    .badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--bad); color: #2b2620; font-weight: bold; }
    .muted { color: var(--muted); }
    #detail .empty { color: var(--muted); }
    .scoreblock { margin-bottom: 16px; }
    .scoreblock h3 { color: var(--gold); font-size: 13px; margin: 0 0 4px; }
    .msg { text-align: center; padding: 60px 20px; color: var(--muted); }
    .msg h1 { color: var(--gold); }
    .refresh { font-size: 13px; }
  </style>
</head>
<body>
  <div id="dash">
    <div class="dash-head">
      <div><h1>CodeQuest Dashboard</h1><div class="sub" id="teacher-name"></div></div>
      <button class="secondary refresh" id="refresh">↻ Refresh</button>
    </div>
    <div id="content"></div>
  </div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
